# Public temporary CSV analysis, synthetic demo and ABS; restricted M5 remains disabled.
services:
  - type: web
    name: marginguard
    runtime: python
    plan: free
    region: singapore
    autoDeployTrigger: checksPass
    # Root reports and the audit manifest do not change the running application.
    buildFilter:
      ignoredPaths:
        - "*.md"
        - "deployment_files.json"
    buildCommand: pip install -r requirements-production.txt
    startCommand: gunicorn -c gunicorn.conf.py wsgi:app
    healthCheckPath: /api/features
    envVars:
      - key: MARGINGUARD_PUBLIC
        value: "true"
      - key: TRUST_REVERSE_PROXY
        value: "true"
      - key: MARGINGUARD_SECRET_KEY
        generateValue: true
      - key: ENABLE_BUSINESS_UPLOAD
        value: "true"
      # Controlled acceptance is complete; revoke the temporary review gate.
      - key: ENABLE_BUSINESS_UPLOAD_REVIEW
        value: "false"
      - key: MARGINGUARD_UPLOAD_REVIEW_KEY_SHA256
        value: ""
      - key: MARGINGUARD_UPLOAD_REVIEW_DEADLINE
        value: "0"
      - key: ENABLE_M5_DEMO
        value: "false"
      - key: ENABLE_SYNTHETIC_DEMO
        value: "true"
      - key: M5_PUBLIC_LICENSE_CONFIRMED
        value: "false"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
